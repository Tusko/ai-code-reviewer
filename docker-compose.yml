services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - GITLAB_URL=${GITLAB_URL:-https://gitlab.com}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - SIDOROVICH_BOT_USERNAME=${SIDOROVICH_BOT_USERNAME:-}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-320}
      - OLLAMA_NUM_BATCH=${OLLAMA_NUM_BATCH:-512}
      - INCLUDE_FILE_CONTEXT=${INCLUDE_FILE_CONTEXT:-false}
      - CONTEXT_WINDOW=${CONTEXT_WINDOW:-15}
      - PER_FILE_TIMEOUT_S=${PER_FILE_TIMEOUT_S:-90}
      - MR_TIMEOUT_S=${MR_TIMEOUT_S:-480}
      - MAX_FILES=${MAX_FILES:-40}
      - QUEUE_MAXSIZE=${QUEUE_MAXSIZE:-32}
      - DEDUPE_CACHE_SIZE=${DEDUPE_CACHE_SIZE:-256}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it:free}
      - OPENROUTER_FALLBACK_MODELS=${OPENROUTER_FALLBACK_MODELS:-}
      - OPENROUTER_MAX_TOKENS=${OPENROUTER_MAX_TOKENS:-512}
      - OPENROUTER_VOICE_MAX_TOKENS=${OPENROUTER_VOICE_MAX_TOKENS:-2048}
      - SIDOROVICH_OLLAMA_FALLBACK=${SIDOROVICH_OLLAMA_FALLBACK:-false}
      - OPENROUTER_REVIEW_MODEL=${OPENROUTER_REVIEW_MODEL:-poolside/laguna-s-2.1}
      - OPENROUTER_REVIEW_FALLBACK_MODELS=${OPENROUTER_REVIEW_FALLBACK_MODELS:-}
      - REVIEW_CONTEXT_TOKENS=${REVIEW_CONTEXT_TOKENS:-262144}
      - REVIEW_MAX_OUTPUT_TOKENS=${REVIEW_MAX_OUTPUT_TOKENS:-4096}
      - SIDOROVICH_ENABLED=${SIDOROVICH_ENABLED:-true}
      - MAX_MR_FILES=${MAX_MR_FILES:-60}
      - MR_COMMENT_BUDGET=${MR_COMMENT_BUDGET:-30}
      - LEDGER_MAX_HUNKS=${LEDGER_MAX_HUNKS:-2000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  tunnel:
    image: cloudflare/cloudflared:latest
    env_file:
      - .env
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: always